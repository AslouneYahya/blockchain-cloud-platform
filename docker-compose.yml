services:
  # ---------------------------------------------------------------------------
  # Reverse proxy — routes traffic to Go cluster daemon and React Web3 dashboard
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Go Cluster Daemon — Smart Contract Gatekeeper, Raft consensus, K3s Orchestrator
  # ---------------------------------------------------------------------------
  backend:
    build: ./cluster-daemon
    expose:
      - "8080"
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      DATA_DIR: "/data"
      IMMUDB_HOST: "immudb"
      IMMUDB_PORT: "3322"
      CLUSTER_TOTAL_RAM_MB: "12288"
      K3S_NAMESPACE: "default"
      CLUSTER_DOMAIN: "cluster.local"
    volumes:
      - ledger_data:/data
    depends_on:
      - immudb
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # immudb — Cryptographic Immutable Ledger with Merkle Tree & Raft Consensus
  # ---------------------------------------------------------------------------
  immudb:
    image: codenotary/immudb:latest
    ports:
      - "3322:3322"
      - "9497:9497" # Web console / metrics
    volumes:
      - immudb_data:/var/lib/immudb
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Vite / React Web3 frontend with Client-Side Cryptography (MetaMask / Local Key)
  # ---------------------------------------------------------------------------
  frontend:
    build: ./frontend
    expose:
      - "5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Named volumes for immutable cryptographic ledger persistence
# ---------------------------------------------------------------------------
volumes:
  immudb_data:
  ledger_data:
